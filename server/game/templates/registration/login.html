{% extends "game/base.html" %}
{% load static %}
{% block title %}Chaos &middot; Log in{% endblock %}
{% block indexing %}<meta name="robots" content="noindex">{% endblock %}
{% block body %}
<main class="lobby">
  <h1 class="title"><a href="{% url 'index' %}"><img src="{% static 'game/img/logo.png' %}" alt="CHAOS" width="960" height="272"></a></h1>
  <div class="cards">
    <form class="card" method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <h2>Log in</h2>
      {% include "game/_form_fields.html" %}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Log in</button>
      <p class="hint">No account? <a href="{% url 'signup' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Sign up</a>,
        or <a href="{% url 'index' %}">play without one</a>.</p>
    </form>
  </div>
</main>
{% endblock %}
