{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Chaos Online{% endblock %}</title>
<meta name="description" content="{% block description %}Play Chaos, Julian Gollop's 1985 ZX Spectrum game of battling wizards, free in your browser: up to 8 wizards, against friends or computer wizards.{% endblock %}">
{% block indexing %}<link rel="canonical" href="{{ site_origin }}{{ request.path }}">{% endblock %}
<meta property="og:type" content="website">
<meta property="og:site_name" content="Chaos Online">
<meta property="og:title" content="Chaos Online">
<meta property="og:description" content="Play Julian Gollop's ZX Spectrum classic Chaos in your browser, with up to 8 wizards.">
<meta property="og:url" content="{{ site_origin }}{{ request.path }}">
<meta property="og:image" content="{{ site_origin }}{% static 'game/img/og.png' %}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="CHAOS">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{% static 'game/img/favicon.ico' %}" sizes="any">
<link rel="icon" href="{% static 'game/img/favicon-32.png' %}" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="{% static 'game/img/apple-touch-icon.png' %}">
<link rel="stylesheet" href="{% static 'game/css/style.css' %}">
</head>
<body>
{% block body %}{% endblock %}
<footer class="footer"><a href="{% url 'help' %}">Help</a> &middot;
  <a href="https://discord.gg/WBpZ5BwfHY" target="_blank" rel="noopener">Discord</a> &middot; <a href="{% url 'privacy' %}">Privacy policy</a>
  <span class="version">&middot; v{{ site_version }}{% if site_commit %} ({{ site_commit }}){% endif %}</span></footer>
</body>
</html>
